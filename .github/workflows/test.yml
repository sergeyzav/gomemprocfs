name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      memprocfs-versions: ${{ steps.get-versions.outputs.versions }}
      dump-cache-key: ${{ steps.set-dump-key.outputs.key }}
    steps:
      - name: Fetch Latest MemProcFS Versions
        id: get-versions
        run: |
          # Fetch the last 2 non-draft, non-prerelease tags (latest and previous)
          VERSIONS=$(curl -sfL https://api.github.com/repos/ufrisk/MemProcFS/releases | jq -c '[.[] | select(.prerelease==false and .draft==false) | .tag_name] | .[0:2]')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Generate dump cache key
        id: set-dump-key
        env:
          GCS_MEMDUMP_PATH: ${{ vars.GCS_MEMDUMP_PATH }}
        run: |
          # Create a key based on the dump path. If the path changes, the cache breaks.
          HASH=$(echo -n "$GCS_MEMDUMP_PATH" | sha256sum | awk '{print $1}')
          echo "key=memdump-zst-$HASH" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.memprocfs-version }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        memprocfs-version: ${{ fromJSON(needs.prepare.outputs.memprocfs-versions) }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache compressed memory dump
        id: cache-dump
        uses: actions/cache@v4
        with:
          path: dumps/memdump.raw.zst
          key: ${{ needs.prepare.outputs.dump-cache-key }}

      - name: Authenticate to Google Cloud
        if: steps.cache-dump.outputs.cache-hit != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.cache-dump.outputs.cache-hit != 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Download memory dump (if not cached)
        if: steps.cache-dump.outputs.cache-hit != 'true'
        env:
          GCS_MEMDUMP_PATH: ${{ vars.GCS_MEMDUMP_PATH }}
        run: |
          mkdir -p dumps
          gcloud storage cp "$GCS_MEMDUMP_PATH" dumps/memdump.raw.zst

      - name: Decompress memory dump
        run: |
          # Decompress from the cached (or freshly downloaded) .zst file
          zstd -d dumps/memdump.raw.zst -o dumps/memdump.raw

      - name: Cache MemProcFS
        id: cache-vmm
        uses: actions/cache@v4
        with:
          path: memprocfs
          key: memprocfs-ubuntu-latest-${{ matrix.memprocfs-version }}

      - name: Download MemProcFS
        if: steps.cache-vmm.outputs.cache-hit != 'true'
        env:
          MEMPROCFS_VERSION: ${{ matrix.memprocfs-version }}
        run: |
          mkdir -p memprocfs
          
          PATTERN="linux_x64"
          
          # Fetch assets list for the specific version using env var to avoid injection
          ASSETS=$(curl -sfL "https://api.github.com/repos/ufrisk/MemProcFS/releases/tags/$MEMPROCFS_VERSION")
          
          # Find the exact asset URL matching the pattern
          DOWNLOAD_URL=$(echo "$ASSETS" | jq -r ".assets[] | select(.name | test(\"$PATTERN\")) | .browser_download_url" | head -1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find asset for pattern $PATTERN in release $MEMPROCFS_VERSION"
            exit 1
          fi
          
          curl -sfL "$DOWNLOAD_URL" -o memprocfs/release.tar.gz
          
          cd memprocfs
          tar -xzf release.tar.gz
          rm -f release.tar.gz

      - name: Locate Native Library
        id: vmm-path
        run: |
          # Only look for Linux shared objects
          VMM_LIB=$(find memprocfs -name "vmm.so" -o -name "libvmm.so" | head -1)
          if [ -z "$VMM_LIB" ]; then
            echo "::error::Could not find native library in MemProcFS release"
            find memprocfs -type f | head -20
            exit 1
          fi
          
          # Strip leading ./ if find added it
          VMM_LIB=${VMM_LIB#./}
          DIR_NAME=$(dirname "$VMM_LIB")
          
          ABS_PATH="${{ github.workspace }}/$VMM_LIB"
          ABS_DIR="${{ github.workspace }}/$DIR_NAME"
          
          echo "path=$ABS_PATH" >> "$GITHUB_OUTPUT"
          echo "dir=$ABS_DIR" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        env:
          VMM_DLL_PATH: ${{ steps.vmm-path.outputs.path }}
          MEMDUMP_PATH: ${{ github.workspace }}/dumps/memdump.raw
          LD_LIBRARY_PATH: ${{ steps.vmm-path.outputs.dir }}
        run: go test -count=1 ./...

      # Save this version's result for the compatibility badges.
      # "skipped" means an earlier step (download, setup) failed.
      - name: Save compatibility result
        if: always()
        env:
          MEMPROCFS_VERSION: ${{ matrix.memprocfs-version }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p compat
          echo "$OUTCOME" > "compat/$MEMPROCFS_VERSION.txt"

      - name: Upload compatibility result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.memprocfs-version }}
          path: compat/
          retention-days: 1

  # Publishes one shields.io endpoint JSON per tested MemProcFS version to the
  # "badges" branch. README badges read them via raw.githubusercontent.com.
  badges:
    name: Update Compatibility Badges
    needs: [prepare, test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compatibility results
        uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: results
          merge-multiple: true

      - name: Generate badge files
        env:
          VERSIONS: ${{ needs.prepare.outputs.memprocfs-versions }}
        run: |
          mkdir -p out
          # Slot 0 is the newest version, so README badges keep a fixed order
          # while the versions in them change.
          i=0
          for v in $(echo "$VERSIONS" | jq -r '.[]'); do
            outcome=$(cat "results/$v.txt" 2>/dev/null || echo unknown)
            case "$outcome" in
              success) msg=passing; color=brightgreen ;;
              failure) msg=failing; color=red ;;
              *)       msg=unknown; color=lightgrey ;;
            esac
            jq -n --arg label "MemProcFS $v" --arg msg "$msg" --arg color "$color" \
              '{schemaVersion: 1, label: $label, message: $msg, color: $color, cacheSeconds: 300}' \
              > "out/memprocfs-$i.json"
            echo "slot $i: $v -> $msg"
            i=$((i + 1))
          done

      - name: Push to badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update compatibility badges"
          # Force push keeps the branch at a single commit.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" badges
