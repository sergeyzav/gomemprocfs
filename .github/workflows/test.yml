name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      memprocfs-versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - name: Fetch Latest MemProcFS Versions
        id: get-versions
        run: |
          # Fetch the last 3 non-draft, non-prerelease tags
          VERSIONS=$(curl -sfL https://api.github.com/repos/ufrisk/MemProcFS/releases | jq -c '[.[] | select(.prerelease==false and .draft==false) | .tag_name] | .[0:3]')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.memprocfs-version }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        memprocfs-version: ${{ fromJSON(needs.prepare.outputs.memprocfs-versions) }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download memory dump
        env:
          GCS_MEMDUMP_PATH: ${{ vars.GCS_MEMDUMP_PATH }}
        run: |
          mkdir -p dumps
          gcloud storage cp "$GCS_MEMDUMP_PATH" dumps/memdump.raw.zst
          zstd -d dumps/memdump.raw.zst -o dumps/memdump.raw
          rm dumps/memdump.raw.zst

      - name: Cache MemProcFS
        id: cache-vmm
        uses: actions/cache@v4
        with:
          path: memprocfs
          key: memprocfs-ubuntu-latest-${{ matrix.memprocfs-version }}

      - name: Download MemProcFS
        if: steps.cache-vmm.outputs.cache-hit != 'true'
        run: |
          mkdir -p memprocfs
          
          PATTERN="linux_x64"
          
          # Fetch assets list for the specific version
          ASSETS=$(curl -sfL https://api.github.com/repos/ufrisk/MemProcFS/releases/tags/${{ matrix.memprocfs-version }})
          
          # Find the exact asset URL matching the pattern, excluding "latest" zip for Windows
          DOWNLOAD_URL=$(echo "$ASSETS" | jq -r ".assets[] | select(.name | test(\"$PATTERN\")) | select(.name | test(\"latest\") | not) | .browser_download_url" | head -1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find asset for pattern $PATTERN in release ${{ matrix.memprocfs-version }}"
            exit 1
          fi
          
          curl -sfL "$DOWNLOAD_URL" -o memprocfs/release.archive
          
          cd memprocfs
          if [[ "$DOWNLOAD_URL" == *.tar.gz ]]; then
            tar -xzf release.archive
          elif [[ "$DOWNLOAD_URL" == *.zip ]]; then
            unzip -q release.archive
          fi
          rm -f release.archive

      - name: Locate Native Library
        id: vmm-path
        run: |
          VMM_LIB=$(find memprocfs -name "vmm.dll" -o -name "vmm.so" -o -name "libvmm.so" -o -name "vmm.dylib" | head -1)
          if [ -z "$VMM_LIB" ]; then
            echo "::error::Could not find native library in MemProcFS release"
            find memprocfs -type f | head -20
            exit 1
          fi
          
          # Strip leading ./ if find added it
          VMM_LIB=${VMM_LIB#./}
          DIR_NAME=$(dirname "$VMM_LIB")
          
          ABS_PATH="${{ github.workspace }}/$VMM_LIB"
          ABS_DIR="${{ github.workspace }}/$DIR_NAME"
          
          # Add directory to PATH so Windows can find leechcore.dll dependency
          echo "$ABS_DIR" >> "$GITHUB_PATH"
          
          echo "path=$ABS_PATH" >> "$GITHUB_OUTPUT"
          echo "dir=$ABS_DIR" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          VMM_DLL_PATH: ${{ steps.vmm-path.outputs.path }}
          MEMDUMP_PATH: ${{ github.workspace }}/dumps/memdump.raw
          LD_LIBRARY_PATH: ${{ steps.vmm-path.outputs.dir }}
          DYLD_LIBRARY_PATH: ${{ steps.vmm-path.outputs.dir }}
        run: go test -count=1 ./...